<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MGPS Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="home.html">MGPS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" href="home.html">Home</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item"><span class="nav-link" id="userName">User</span></li>
        <li class="nav-item"><button class="nav-link btn btn-link" id="logoutBtn">Logout</button></li>
      </ul>
    </div>
  </div>
</nav>

<header class="hero bg-light py-5">
  <div class="container">
    <h1 class="display-5">MGPS Portal</h1>
    <p class="lead">Welcome to the Management and GPS System</p>
  </div>
</header>

<main class="container py-5">
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">User Profile</h5>
      <div id="userDetails">
        <p><strong>Loading user information...</strong></p>
      </div>
    </div>
  </div>
</main>

<footer class="footer py-4 bg-primary text-white">
  <div class="container text-center">
    <small>MGPS | Employee Role-Based Access | CISF Ready</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
  async function checkAuth() {
    try {
      const result = await ApiService.verify();
      if (result.authenticated) {
        const user = result.user;
        document.getElementById('userName').textContent = `Welcome, ${user.name}`;
        
        const details = `
          <p><strong>Employee ID:</strong> ${user.empId}</p>
          <p><strong>Name:</strong> ${user.name}</p>
          <p><strong>Designation:</strong> ${user.designation || 'N/A'}</p>
          <p><strong>Department:</strong> ${user.deptCode || 'N/A'}</p>
          <p><strong>Roles:</strong> ${user.roles.join(', ') || 'None'}</p>
        `;
        document.getElementById('userDetails').innerHTML = details;
      } else {
        window.location.href = 'login.html';
      }
    } catch (error) {
      console.error('Auth check failed:', error);
      window.location.href = 'login.html';
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    try {
      await ApiService.logout();
      window.location.href = 'login.html';
    } catch (error) {
      console.error('Logout failed:', error);
      window.location.href = 'login.html';
    }
  });

  checkAuth();
</script>
</body>
</html>
